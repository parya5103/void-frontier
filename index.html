<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="description" content="VOID FRONTIER - a browser-based space empire strategy prototype. Milestone 1: single-player local prototype.">
<title>VOID FRONTIER — Helios Concord</title>
<link rel="stylesheet" href="./css/style.css">
<!-- Boot watchdog: a CLASSIC (non-module) script so it runs even if the ES
     module graph fails to load. Without this, a module-load failure leaves the
     overlay stuck on "Booting…" with no visible error. -->
<script>
(function () {
  var booted = false;
  window.__VF_BOOT_OK__ = function () { booted = true; };
  function fail(msg) {
    var ov = document.getElementById('overlay');
    var m = document.getElementById('ov-msg');
    var e = document.getElementById('ov-err');
    if (ov) { ov.classList.add('show'); ov.style.display = ''; }
    if (m) m.textContent = 'VOID FRONTIER could not start.';
    if (e) { e.hidden = false; e.textContent = msg; }
  }
  window.addEventListener('error', function (ev) {
    if (booted) return;
    var t = ev.target;
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      fail('Failed to load ' + (t.src || t.href) + '. Check your connection and reload.');
    }
  }, true);
  setTimeout(function () {
    if (!booted) fail('Startup timed out. Your browser may not support ES modules or WebGL. Try a current Chrome, Edge, Firefox or Safari.');
  }, 12000);
})();
</script>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>

  <!-- ================= HUD ================= -->
  <header id="hud">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <ellipse cx="16" cy="16" rx="13" ry="5" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".75"/>
        <ellipse cx="16" cy="16" rx="13" ry="5" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".75" transform="rotate(60 16 16)"/>
        <circle cx="16" cy="16" r="1.6" fill="currentColor"/>
      </svg>
      <div class="brand-text"><b>VOID FRONTIER</b><span>HELIOS CONCORD · SECTOR 07</span></div>
    </div>

    <div class="res-bar">
      <div class="res" data-res="metal">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 14.5 8 8 14.5 1.5 8Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 5 11 8 8 11 5 8Z" fill="currentColor"/></svg>
        <div class="res-txt"><span class="val" id="val-metal">0</span><span class="rate" id="rate-metal">+0/s</span></div>
      </div>
      <div class="res" data-res="crystal">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2 12.4 6 8 14.8 3.6 6Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.2V14.8M3.6 6h8.8" stroke="currentColor" stroke-width=".9" opacity=".8"/></svg>
        <div class="res-txt"><span class="val" id="val-crystal">0</span><span class="rate" id="rate-crystal">+0/s</span></div>
      </div>
      <div class="res" data-res="energy">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.4 1 3.6 9h3.1L6 15l5.9-8.3H8.7Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        <div class="res-txt"><span class="val" id="val-energy">0</span><span class="rate" id="rate-energy">+0/s</span></div>
      </div>
      <div class="res res-colonies" data-res="colonies" title="Colonized worlds">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2.2" fill="currentColor"/></svg>
        <div class="res-txt"><span class="val" id="val-colonies">0</span><span class="rate">worlds</span></div>
      </div>
    </div>

    <div class="hud-actions">
      <button class="icon-btn" id="btn-sound" data-action="toggle-sound" title="Sound" aria-label="Toggle sound">
        <svg class="i-on" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3L10 4v12L6 12.5H3Z" fill="currentColor"/><path d="M12.6 6.4a5 5 0 0 1 0 7.2M14.9 4.1a8.2 8.2 0 0 1 0 11.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg class="i-off" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3L10 4v12L6 12.5H3Z" fill="currentColor"/><path d="M13 8l4 4M17 8l-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
      </button>
      <button class="icon-btn" data-action="save" title="Save" aria-label="Save progress">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h9l3 3v11H4Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 3v5h6V3M7 14h6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="icon-btn" data-action="panel" data-panel="help" title="Command log / help" aria-label="Help">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 9v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="6.4" r="1.05" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <!-- ================= SYSTEM CHIPS ================= -->
  <div id="systems" class="chips" role="tablist" aria-label="Star systems"></div>

  <!-- ================= PLANET CARD ================= -->
  <section id="planet-card" class="card" hidden>
    <div class="pc-head">
      <div class="pc-ident">
        <span class="pc-type" id="pc-type">—</span>
        <h2 id="pc-name">Unknown World</h2>
        <span class="pc-sys" id="pc-sys">—</span>
      </div>
      <div class="pc-status" id="pc-status">UNCLAIMED</div>
    </div>
    <div class="pc-stats" id="pc-stats"></div>
    <div class="pc-body" id="pc-body"></div>
    <div class="pc-actions" id="pc-actions"></div>
  </section>

  <!-- ================= DOCK ================= -->
  <nav id="dock" aria-label="Command panels">
    <button class="dock-btn" data-action="panel" data-panel="planet"><i></i><span>WORLD</span></button>
    <button class="dock-btn" data-action="panel" data-panel="research"><i></i><span>RESEARCH</span></button>
    <button class="dock-btn" data-action="panel" data-panel="shipyard"><i></i><span>SHIPYARD</span></button>
    <button class="dock-btn" data-action="panel" data-panel="fleet"><i></i><span>FLEET</span></button>
    <button class="dock-btn" data-action="map"><i></i><span>GALAXY</span></button>
  </nav>

  <!-- ================= SIDE SHEET ================= -->
  <aside id="sheet" aria-hidden="true">
    <div class="sheet-head">
      <span id="sheet-title">PANEL</span>
      <button class="icon-btn" data-action="close-sheet" aria-label="Close panel">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <section class="panel" id="panel-planet"></section>
      <section class="panel" id="panel-research"></section>
      <section class="panel" id="panel-shipyard"></section>
      <section class="panel" id="panel-fleet"></section>
      <section class="panel" id="panel-help"></section>
    </div>
  </aside>

  <div id="toasts" aria-live="polite"></div>

  <!-- ============== GRAPHICS CONTEXT-LOSS NOTICE ============== -->
  <div id="gfx-notice" hidden>
    <div class="gfx-inner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
      <div class="gfx-txt">
        <b id="gfx-title">Graphics context lost</b>
        <span id="gfx-sub">Restoring…</span>
      </div>
      <button class="btn sm" id="gfx-retry" hidden>Retry graphics</button>
    </div>
  </div>

  <!-- ================= LOADING / FATAL OVERLAY ================= -->
  <div id="overlay" class="show">
    <div class="ov-inner">
      <div class="ov-logo">VOID<span>FRONTIER</span></div>
      <div class="ov-tag">HELIOS CONCORD · SECTOR 07 · MILESTONE 1 PROTOTYPE</div>
      <div class="ov-bar"><i id="ov-fill"></i></div>
      <div class="ov-msg" id="ov-msg">Booting…</div>
      <div class="ov-err" id="ov-err" hidden></div>
    </div>
  </div>

  <noscript><div class="noscript">VOID FRONTIER needs JavaScript and WebGL enabled.</div></noscript>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
